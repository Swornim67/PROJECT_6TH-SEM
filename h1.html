  <script>
    let records = [], pendingDeleteId = null;
    const $ = id => document.getElementById(id);
    const money = (n, currency = "NPR") => new Intl.NumberFormat("en-NP", { style:"currency", currency, maximumFractionDigits:2 }).format(Number(n || 0));

    function setStatus(message, kind = "success") {
      const el = $("status-message"); el.textContent = message; el.className = "mt-5 rounded-xl px-4 py-3 text-sm font-medium " + (kind === "error" ? "bg-[#FCEBE7] text-[#A33C34]" : "bg-[#E4F5EE] text-[#116C53]");
    }
    function currentTransactions() { return records.filter(r => r.type === "Income" || r.type === "Expense"); }
    function updateSummary() {
      const tx = currentTransactions(), income = tx.filter(r=>r.type==="Income").reduce((s,r)=>s+Number(r.amount),0), expense = tx.filter(r=>r.type==="Expense").reduce((s,r)=>s+Number(r.amount),0);
      $("income-total").textContent = money(income); $("expense-total").textContent = money(expense); $("balance-total").textContent = money(income-expense); $("record-count").textContent = records.length + (records.length === 1 ? " record" : " records");
    }
    function renderTransactions() {
      const list = $("transaction-list"), type = $("filter-type").value, cat = $("filter-category").value.trim().toLowerCase(), month = $("filter-month").value;
      const shown = currentTransactions().filter(r => (!type || r.type === type) && (!cat || r.category.toLowerCase().includes(cat)) && (!month || r.date.startsWith(month))).sort((a,b)=>b.date.localeCompare(a.date));
      list.innerHTML = ""; $("transactions-empty").classList.toggle("hidden", shown.length !== 0);
      shown.forEach(r => {
        const node = $("transaction-template").content.cloneNode(true), el = node.querySelector("article");
        el.dataset.id = r.__backendId; const icon = node.querySelector(".record-icon"); icon.innerHTML = r.type === "Income" ? '<i data-lucide="arrow-down-left" class="w-4 h-4"></i>' : '<i data-lucide="arrow-up-right" class="w-4 h-4"></i>'; icon.className += r.type === "Income" ? " bg-[#E4F5EE] text-[#168666]" : " bg-[#FCEBE7] text-[#C85147]";
        node.querySelector(".record-description").textContent = r.description || r.category;
        node.querySelector(".record-meta").textContent = r.category + " · " + r.date + (r.type === "Expense" ? " · " + r.payment_method : "");
        const amount = node.querySelector(".record-amount"); amount.textContent = (r.type === "Income" ? "+" : "−") + money(r.amount, r.currency); amount.className += r.type === "Income" ? " text-[#168666]" : " text-[#C85147]";
        node.querySelector(".edit-record").onclick = () => editTransaction(r);
        node.querySelector(".delete-record").onclick = () => requestDelete(r);
        list.appendChild(node);
      }); lucide.createIcons();
    }
    function renderBudgets() {
      const budgets = records.filter(r=>r.type==="Budget"), list = $("budget-list"); list.innerHTML = ""; $("budgets-empty").classList.toggle("hidden", budgets.length !== 0);
      budgets.forEach(b => {
        const node = $("budget-template").content.cloneNode(true), el = node.querySelector("article"), spend = currentTransactions().filter(r=>r.type==="Expense" && r.category===b.category && r.date.startsWith(b.date)).reduce((s,r)=>s+Number(r.amount),0), limit = Number(b.budget_limit), ratio = limit ? Math.min(spend/limit*100,100) : 0;
        el.dataset.id=b.__backendId; node.querySelector(".budget-category").textContent=b.category; node.querySelector(".budget-month").textContent=b.date + " · " + b.period; node.querySelector(".budget-spent").textContent="Spent " + money(spend); node.querySelector(".budget-limit").textContent="Limit " + money(limit);
        const bar=node.querySelector(".budget-bar"); bar.style.width=ratio+"%"; bar.style.background=spend>limit?"#E5665A":ratio>=80?"#E5AD43":"#21B289";
        const status=node.querySelector(".budget-status"); status.textContent=spend>limit ? money(spend-limit)+" over budget" : ratio>=80 ? money(limit-spend)+" remaining — approaching limit" : money(limit-spend)+" remaining"; status.className += spend>limit?" text-[#F5A69F]":ratio>=80?" text-[#F3D28D]":" text-[#B9E8D9]";
        node.querySelector(".edit-budget").onclick=()=>editBudget(b); node.querySelector(".delete-budget").onclick=()=>requestDelete(b); list.appendChild(node);
      }); lucide.createIcons();
    }
    function render() { updateSummary(); renderTransactions(); renderBudgets(); }
    function editTransaction(r) { $("transaction-id").value=r.__backendId; $("type").value=r.type; $("amount").value=r.amount; $("currency").value=r.currency; $("category").value=r.category; $("date").value=r.date; $("payment-method").value=r.payment_method; $("description").value=r.description; $("transaction-submit").textContent="Save transaction changes"; $("transaction-cancel").classList.remove("hidden"); $("transaction-panel").scrollIntoView({behavior:"smooth"}); }
    function editBudget(r) { $("budget-id").value=r.__backendId; $("budget-category").value=r.category; $("budget-limit").value=r.budget_limit; $("budget-month").value=r.date; $("budget-period").value=r.period; $("budget-submit").textContent="Save budget changes"; $("budget-cancel").classList.remove("hidden"); $("budget-form-panel").scrollIntoView({behavior:"smooth"}); }
    function resetTransaction() { $("transaction-form").reset(); $("transaction-id").value=""; $("transaction-submit").textContent="Save transaction"; $("transaction-cancel").classList.add("hidden"); }
    function resetBudget() { $("budget-form").reset(); $("budget-id").value=""; $("budget-submit").textContent="Create budget"; $("budget-cancel").classList.add("hidden"); }
    async function requestDelete(record) {
      if (pendingDeleteId === record.__backendId) { const res=await window.dataSdk.delete(record); pendingDeleteId=null; setStatus(res.isOk ? "Record deleted." : "Could not delete this record.", res.isOk?"success":"error"); return; }
      pendingDeleteId=record.__backendId; setStatus("Click the same delete button again to permanently delete this record.", "error");
    }
    async function saveRecord(record, id, button) {
      button.disabled=true; const res=id ? await window.dataSdk.update({...record,__backendId:id}) : await window.dataSdk.create(record); button.disabled=false;
      if (res.isOk) { setStatus(id ? "Changes saved." : "Record saved to your sheet."); return true; } setStatus("We could not save that record. Please try again.", "error"); return false;
    }
    $("transaction-form").addEventListener("submit", async e => { e.preventDefault(); const id=$("transaction-id").value, amount=Number($("amount").value); if (!(amount>0)) return setStatus("Enter an amount greater than zero.", "error"); const ok=await saveRecord({type:$("type").value,amount,currency:$("currency").value,category:$("category").value.trim(),date:$("date").value,description:$("description").value.trim(),payment_method:$("payment-method").value,budget_limit:0,period:"",created_at:new Date().toISOString()},id,$("transaction-submit")); if(ok) resetTransaction(); });
    $("budget-form").addEventListener("submit", async e => { e.preventDefault(); const id=$("budget-id").value, limit=Number($("budget-limit").value); if (!(limit>0)) return setStatus("Enter a budget limit greater than zero.", "error"); const ok=await saveRecord({type:"Budget",amount:0,currency:"NPR",category:$("budget-category").value.trim(),date:$("budget-month").value,description:"",payment_method:"",budget_limit:limit,period:$("budget-period").value,created_at:new Date().toISOString()},id,$("budget-submit")); if(ok) resetBudget(); });
    $("transaction-cancel").onclick=resetTransaction; $("budget-cancel").onclick=resetBudget;
    ["filter-type","filter-category","filter-month"].forEach(id => $(id).addEventListener("input",renderTransactions));
    const handler={onDataChanged(data){records=data; render();}};
    (async()=>{ $("date").value=new Date().toISOString().slice(0,10); $("budget-month").value=new Date().toISOString().slice(0,7); const result=await window.dataSdk.init(handler); if(!result.isOk)setStatus("Your records could not be loaded right now.","error"); })();
    lucide.createIcons();
  </script>
 </body>
</html>
