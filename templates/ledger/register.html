{% extends 'ledger/base.html' %}{% block content %}<div class="auth-card card shadow-sm mx-auto"><div class="card-body p-4"><h2>Create your account</h2><form method="post">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}<button class="btn btn-primary w-100">Register</button></form><p class="mt-3 mb-0">Already registered? <a href="{% url 'login' %}">Log in</a></p></div></div>{% endblock %}
