{% extends 'ledger/base.html' %}

{% block content %}

<div class="card col-md-6 mx-auto">
    <div class="card-body">

        <h2>Delete record?</h2>

        <p>
            This will permanently delete
            <strong>{{ item }}</strong>.
        </p>

        <form method="post">
            {% csrf_token %}

            <button type="submit" class="btn btn-danger">
                Delete
            </button>

            <a
                href="javascript:history.back()"
                class="btn btn-light"
            >
                Cancel
            </a>
        </form>

    </div>
</div>

{% endblock %}
