{% extends 'ledger/base.html' %}{% block title %}Log in | MoneyTrack{% endblock %}{% block content %}<div class="auth-card card shadow-sm mx-auto"><div class="card-body p-4"><h2>Welcome back</h2><p class="text-muted">Log in to manage your money.</p><form method="post">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label><input class="form-control" name="{{ field.html_name }}" type="{% if field.name == 'password' %}password{% else %}text{% endif %}" required></div>{% endfor %}<button class="btn btn-primary w-100">Log in</button></form><p class="mt-3 mb-0">New here? <a href="{% url 'register' %}">Create an account</a></p></div></div>{% endblock %}
